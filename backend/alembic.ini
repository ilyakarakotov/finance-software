[alembic]
script_location = migrations
sqlalchemy.url = mssql+pyodbc://%(DB_USER)s:%(DB_PASSWORD)s@%(DB_SERVER)s.database.windows.net/%(DB_NAME)s?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
